name: Build corrected resubmission package v2

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: corrected-resubmission
          environment-file: analysis/environment-corrected.yml
          cache-environment: true
          init-shell: bash

      - name: Reconstruct and verify pipeline
        shell: bash -el {0}
        run: |
          python analysis/reconstruct_corrected_pipeline.py
          python -m py_compile analysis/corrected_resubmission_pipeline.py

      - name: Record software versions
        shell: bash -el {0}
        run: |
          set -euxo pipefail
          which smina
          smina --version || true
          obabel -V
          python - <<'PY'
          import Bio, matplotlib, numpy, openmm, pandas, requests, scipy, rdkit
          from pdbfixer import PDBFixer
          print("RDKit", rdkit.__version__)
          print("OpenMM", openmm.__version__)
          print("NumPy", numpy.__version__)
          print("pandas", pandas.__version__)
          print("SciPy", scipy.__version__)
          print("Biopython", Bio.__version__)
          print("matplotlib", matplotlib.__version__)
          print("requests", requests.__version__)
          print("PDBFixer", PDBFixer)
          PY

      - name: Build corrected package
        shell: bash -el {0}
        run: |
          set -euxo pipefail
          python analysis/corrected_resubmission_pipeline.py --output results/corrected_resubmission

      - name: List generated files
        if: always()
        shell: bash -el {0}
        run: |
          find results/corrected_resubmission -maxdepth 4 -type f -printf '%p\t%s bytes\n' | sort || true

      - name: Upload corrected package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corrected-resubmission-package-v2
          path: |
            results/corrected_resubmission
            analysis/corrected_resubmission_pipeline.py
            analysis/environment-corrected.yml
          if-no-files-found: warn
          retention-days: 14
