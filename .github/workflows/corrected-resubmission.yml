name: Build corrected resubmission package

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Create computational environment
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: corrected-resubmission
          environment-file: analysis/environment-corrected.yml
          cache-environment: true
          init-shell: bash

      - name: Install smina static binary
        shell: bash -el {0}
        run: |
          set -euxo pipefail
          URL1="https://downloads.sourceforge.net/project/smina/smina.static"
          URL2="https://sourceforge.net/projects/smina/files/smina.static/download"
          curl -A "Mozilla/5.0" -L --fail --retry 5 --retry-delay 3 "$URL1" -o /tmp/smina || \
            curl -A "Mozilla/5.0" -L --fail --retry 5 --retry-delay 3 "$URL2" -o /tmp/smina
          test "$(stat -c%s /tmp/smina)" -gt 1000000
          file /tmp/smina
          chmod +x /tmp/smina
          sudo install -m 0755 /tmp/smina /usr/local/bin/smina
          smina --help >/dev/null

      - name: Reconstruct and verify analysis pipeline
        shell: bash -el {0}
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, re, zlib

          expected = {
              "000": "b356c9855eda38a6ef64f268e53ce2f752a55476ba5656b032c132790f2d7120",
              "001": "cccd8e582a577f98b8566f45f631a4e7f998b24eb9d5bff3776d96d41cb5e2b8",
              "002": "41617a144f7e8e3803e44fea8358a7ab28033b99fb4ae0b6678752071cc55e1e",
              "003": "1dc6443439bc635e8e8a8690dc2f6201a1998f6c9aad00f1c7a7052d2ca8480b",
              "004": "d3dce91500498fe0171ca2da43780135274aaa72077638d50ac8c81e0f383ae1",
              "005": "8ce23d88c3f9f4f591baeaefaa2fdf3c4bddabe36ada8aa7f5b0fb8a25a03e14",
              "006": "604ada3e90cf54f607072fdab5977b5accd989a2f443bfd34b17f761ece4f173",
              "007": "1389b4a80194f05ff3d123ea496235c4672608cdc438a6f786d37fa972ee52c6",
              "008": "b6ef19d31937672430d0a20c2229e0c7872da4070f7d4d510822a27a1db3c0e7",
              "009": "8d6cbd82e477940c126e25a58073a34d918d32269bd5cb2ffe02a9a4ee8814f2",
              "010": "cb0033c4e89cedaef8a07fdb47cc761f4231d79fc60d0012679a87157e56b3e7",
              "011": "566fed810df079960afb9cd109895e6aad74c4eb8ee9bc48994c7b73a09e6b3b",
              "012": "dc3e0c184b90e5600cf7bb64913a7cac4abe139daee48a3c3d86666854f3c534",
              "013": "5e5692e4b5923ae6f15a3b68c37e7b787c09719ada301ed64c0d642eae7ecd4c",
          }
          chunks = []
          for i in range(14):
              key = f"{i:03d}"
              path = Path(f"analysis/payload_parts/part.{key}")
              text = re.sub(r"\s+", "", path.read_text(encoding="utf-8"))
              observed = hashlib.sha256(text.encode()).hexdigest()
              if observed != expected[key]:
                  raise RuntimeError(f"Payload part {key} hash mismatch: {observed}")
              chunks.append(text)
          raw = zlib.decompress(base64.b64decode("".join(chunks)))
          observed_script = hashlib.sha256(raw).hexdigest()
          expected_script = "f586edb19690c27800907c74da8198c1cca10f13e1e0b50e16e5aea618bd8aa0"
          if observed_script != expected_script:
              raise RuntimeError(f"Reconstructed script hash mismatch: {observed_script}")
          out = Path("analysis/corrected_resubmission_pipeline.py")
          out.write_bytes(raw)
          print(f"Reconstructed {out} ({len(raw)} bytes; SHA256 {observed_script})")
          PY
          python -m py_compile analysis/corrected_resubmission_pipeline.py

      - name: Record software availability
        shell: bash -el {0}
        run: |
          set -euxo pipefail
          which smina
          smina --version || true
          obabel -V
          python - <<'PY'
          import Bio, matplotlib, numpy, openmm, pandas, requests, scipy
          import rdkit
          from pdbfixer import PDBFixer
          print("RDKit", rdkit.__version__)
          print("OpenMM", openmm.__version__)
          print("NumPy", numpy.__version__)
          print("pandas", pandas.__version__)
          print("SciPy", scipy.__version__)
          print("Biopython", Bio.__version__)
          print("matplotlib", matplotlib.__version__)
          print("requests", requests.__version__)
          print("PDBFixer import", PDBFixer)
          PY

      - name: Build corrected package
        shell: bash -el {0}
        run: |
          set -euxo pipefail
          python analysis/corrected_resubmission_pipeline.py --output results/corrected_resubmission

      - name: List generated files
        if: always()
        shell: bash -el {0}
        run: |
          find results/corrected_resubmission -maxdepth 4 -type f -printf '%p\t%s bytes\n' | sort || true

      - name: Upload corrected package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corrected-resubmission-package
          path: |
            results/corrected_resubmission
            analysis/corrected_resubmission_pipeline.py
            analysis/environment-corrected.yml
          if-no-files-found: warn
          retention-days: 14
